name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA
        required: true

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify requested revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [[ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]]
          then
            echo "Expected $EXPECTED_HEAD_SHA, got $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - run: brew test-bot --only-formulae --testing-formulae=windyskr/tap/acn
        if: github.event_name == 'workflow_dispatch'

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: test-bot
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    uses: ./.github/workflows/publish.yml
    with:
      pull_request: ${{ inputs.pull_request }}
      head_sha: ${{ inputs.head_sha }}
